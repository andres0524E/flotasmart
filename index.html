<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlotaSmart | Gestión Inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    </head>
<body>
    
    <nav class="navbar navbar-expand-lg navbar-dark mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">✨ FlotaSmart</a>
            <div class="text-white text-end">
                <div class="fw-bold fs-5 text-capitalize" id="nav-usuario-rol">Cargando...</div>
                <button class="btn btn-sm btn-outline-light mt-1 py-0 px-2 border-0" id="btn-cerrar-sesion" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="text-dark fw-bold">Panel de Control</h2>
                <p class="text-muted">Gestión estratégica y seguimiento de unidades.</p>
            </div>
            <button class="btn btn-primary shadow-sm px-4 fw-bold" id="btn-nuevo-vehiculo" data-bs-toggle="modal" data-bs-target="#modal-vehiculo">+ Registrar Unidad</button>
        </div>

        <div class="row mb-5" id="seccion-dashboard">
            <div class="col-md-6 mb-3">
                <div class="card shadow-sm border-0 p-3 h-100" style="border-radius: 20px;">
                    <div class="card-body text-center">
                        <h5 class="fw-bold text-secondary mb-3">📊 Salud de la Flota</h5>
                        <canvas id="graficaFlota" style="max-height: 220px;"></canvas>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card shadow-sm border-0 p-3 h-100" style="border-radius: 20px;">
                    <div class="card-body">
                        <h5 class="fw-bold text-danger mb-4 text-center">⚠️ Top 3 Unidades con más Fallas</h5>
                        <div id="contenedor-ranking">
                            <p class="text-center text-muted">Calculando ranking...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row" id="contenedor-vehiculos"></div>
    </div>

    <div class="modal fade" id="modal-vehiculo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow-lg">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold">Nueva Unidad</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formulario-vehiculo">
                        <div class="mb-3"><label class="form-label text-muted fw-bold">Placa</label><input type="text" class="form-control" id="input-placa" required></div>
                        <div class="mb-3"><label class="form-label text-muted fw-bold">Marca</label><input type="text" class="form-control" id="input-marca" required></div>
                        <div class="mb-3"><label class="form-label text-muted fw-bold">Modelo</label><input type="text" class="form-control" id="input-modelo" required></div>
                        <div class="mb-3"><label class="form-label text-muted fw-bold">Año</label><input type="number" class="form-control" id="input-anio" required></div>
                        <button type="submit" class="btn btn-primary w-100 mt-2 fw-bold">Guardar Vehículo</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/principal.js?v=777888"></script>

    <script>
        function cerrarSesion() {
            localStorage.removeItem('usuarioFlota');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
