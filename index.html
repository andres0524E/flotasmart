<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlotaSmart | Gestión Inteligente</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/estilos.css">

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #f4f7fe; }
        .card { border: none; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.02); }
        .status-badge { border-radius: 10px; padding: 5px 15px; font-weight: bold; font-size: 0.8rem; }
        .bg-activo { background-color: #d1e7dd; color: #0f5132; }
        .bg-mantenimiento { background-color: #fff3cd; color: #856404; }
        .navbar { background: white; border-bottom: 1px solid #eee; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg py-3 mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-primary" href="#">✨ FlotaSmart</a>
            <div class="d-flex align-items-center">
                <span class="me-3 small text-muted" id="nombre-usuario">Cargando...</span>
                <button class="btn btn-outline-danger btn-sm" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container mb-5">
        <div class="row g-4">
            
            <div class="col-md-6">
                <div class="card p-4 h-100">
                    <h5 class="fw-bold mb-4">📊 Salud de la Flota</h5>
                    <div style="max-width: 300px; margin: auto;">
                        <canvas id="graficaFlota"></canvas>
                    </div>
                </div>
            </div>

            <div class="col-md-6">
                <div class="card p-4 h-100">
                    <h5 class="fw-bold mb-4 text-danger">🚩 Top 3 Unidades con más Fallas</h5>
                    <div id="contenedor-ranking">
                        </div>
                </div>
            </div>

            <div class="col-12 mt-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold m-0">Panel de Control</h4>
                    <button class="btn btn-primary px-4 fw-bold shadow-sm" data-bs-toggle="modal" data-bs-target="#modalRegistro">
                        + Registrar Unidad
                    </button>
                </div>
                
                <div class="row g-4" id="contenedor-vehiculos">
                    </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/principal.js?v=1001"></script>

    <script>
        // Función rápida para cerrar sesión
        function cerrarSesion() {
            localStorage.removeItem('usuarioFlota');
            window.location.href = 'login.html';
        }
        
        // Mostrar nombre del usuario logueado
        const usuario = JSON.parse(localStorage.getItem('usuarioFlota'));
        if(usuario) {
            document.getElementById('nombre-usuario').textContent = `Hola, ${usuario.nombre}`;
        } else {
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
