<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlotaSmart | Gestión Inteligente</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <link rel="icon" type="image/png" href="img/favicon.png">
</head>
<body class="bg-light">
    
    <nav class="navbar navbar-expand-lg navbar-dark mb-4 shadow-sm" style="background-color: #2c3e50;">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">✨ FlotaSmart</a>
            <div class="text-white text-end">
                <div class="fw-bold fs-6 text-capitalize" id="nav-usuario-rol">Cargando...</div>
                <button class="btn btn-sm btn-outline-light mt-1 py-0 px-2 border-0" id="btn-cerrar-sesion" onclick="cerrarSesion()">Cerrar Sesión</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4 bg-white p-4 rounded-4 shadow-sm">
            <div>
                <h2 class="text-dark fw-bold mb-1">Panel de Control</h2>
                <p class="text-muted mb-0">Gestión estratégica y seguimiento de unidades.</p>
            </div>
            <button class="btn btn-primary shadow-sm px-4 py-2 fw-bold rounded-3" id="btn-registrar-unidad" data-bs-toggle="modal" data-bs-target="#modal-vehiculo">+ Registrar Unidad</button>
        </div>

        <div class="row mb-5" id="seccion-dashboard">
            <div class="col-md-6 mb-3">
                <div class="card shadow-sm border-0 p-3 h-100 rounded-4">
                    <div class="card-body text-center">
                        <h5 class="fw-bold text-secondary mb-3">📊 Salud de la Flota</h5>
                        <div style="max-height: 220px; display: flex; justify-content: center;">
                            <canvas id="graficaFlota"></canvas>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <div class="card shadow-sm border-0 p-3 h-100 rounded-4">
                    <div class="card-body">
                        <h5 class="fw-bold text-danger mb-4 text-center">⚠️ Top 3 Unidades con más Fallas</h5>
                        <div id="contenedor-ranking">
                            <p class="text-center text-muted">Calculando ranking...</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="row" id="contenedor-vehiculos"></div>
    </div>

    <div class="modal fade" id="modal-vehiculo" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header bg-primary text-white rounded-top-4">
                    <h5 class="modal-title fw-bold">Nueva Unidad</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formulario-vehiculo">
                        <div class="mb-3"><label class="form-label text-muted fw-bold">Placa</label><input type="text" class="form-control" id="input-placa" placeholder="Ej. ABC-123" required></div>
                        <div class="mb-3"><label class="form-label text-muted fw-bold">Marca</label><input type="text" class="form-control" id="input-marca" placeholder="Ej. Toyota" required></div>
                        <div class="mb-3"><label class="form-label text-muted fw-bold">Modelo</label><input type="text" class="form-control" id="input-modelo" placeholder="Ej. Hilux" required></div>
                        <div class="mb-3"><label class="form-label text-muted fw-bold">Año</label><input type="number" class="form-control" id="input-anio" placeholder="Ej. 2022" required></div>
                        <button type="submit" class="btn btn-primary w-100 mt-3 fw-bold rounded-3">Guardar Vehículo</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modal-uso" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header bg-success text-white rounded-top-4">
                    <h5 class="modal-title fw-bold">🚗 Solicitar Salida</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formulario-uso">
                        <input type="hidden" id="uso-id-vehiculo">
                        <div class="mb-3"><label class="form-label text-muted fw-bold">ID Operador</label><input type="number" class="form-control bg-light" id="uso-id-usuario" readonly></div>
                        <div class="mb-3">
                            <label class="form-label text-muted fw-bold">Propósito</label>
                            <select class="form-select" id="uso-proposito" required>
                                <option value="Logística">Logística / Entrega</option>
                                <option value="Transporte Interno">Transporte de Personal</option>
                                <option value="Servicios Operativos">Servicios Operativos</option>
                            </select>
                        </div>
                        <div class="mb-3"><label class="form-label text-muted fw-bold">Kilometraje de Salida</label><input type="number" class="form-control" id="uso-kilometraje" placeholder="Ej. 15000" required></div>
                        <button type="submit" class="btn btn-success w-100 mt-3 fw-bold rounded-3">Confirmar Salida</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modal-evento" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header bg-danger text-white rounded-top-4">
                    <h5 class="modal-title fw-bold">🔧 Reportar Incidencia</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formulario-evento">
                        <input type="hidden" id="evento-id-vehiculo">
                        <div class="mb-3">
                            <label class="form-label text-muted fw-bold">Tipo de reporte</label>
                            <select class="form-select" id="evento-tipo" required>
                                <option value="Falla Técnica">Falla Técnica</option>
                                <option value="Mantenimiento Preventivo">Mantenimiento Preventivo</option>
                                <option value="Accidente">Accidente Vial</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted fw-bold">Causa Raíz</label>
                            <select class="form-select" id="evento-causa" required>
                                <option value="Desgaste Natural">Desgaste Natural (Uso normal)</option>
                                <option value="Negligencia del Operador">Negligencia del Operador</option>
                                <option value="Condiciones de Ruta/Clima">Condiciones de Ruta/Clima</option>
                                <option value="Falla de Fábrica">Falla de Fábrica / Defecto</option>
                            </select>
                        </div>
                        <div class="mb-3"><label class="form-label text-muted fw-bold">Descripción detallada</label><textarea class="form-control" id="evento-descripcion" rows="3" placeholder="Describe el problema detectado..." required></textarea></div>
                        <div class="mb-3"><label class="form-label text-muted fw-bold">Costo estimado ($)</label><input type="number" class="form-control" id="evento-costo" step="0.01" value="0"></div>
                        <button type="submit" class="btn btn-danger w-100 mt-3 fw-bold rounded-3">Enviar al Taller</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modal-gasolina" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header text-white rounded-top-4" style="background-color: #343a40;">
                    <h5 class="modal-title fw-bold">⛽ Registrar Combustible</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="formulario-gasolina">
                        <input type="hidden" id="gasolina-id-vehiculo">
                        <div class="mb-3">
                            <label class="form-label text-muted fw-bold">Litros Cargados</label>
                            <input type="number" class="form-control" id="gasolina-litros" step="0.01" placeholder="Ej. 40.5" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted fw-bold">Costo Total ($)</label>
                            <input type="number" class="form-control" id="gasolina-costo" step="0.01" placeholder="Ej. 950.00" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label text-muted fw-bold">Kilometraje actual</label>
                            <input type="number" class="form-control" id="gasolina-km" placeholder="Kilometraje en la bomba" required>
                        </div>
                        <button type="submit" class="btn btn-dark w-100 mt-3 fw-bold rounded-3">Guardar Ticket</button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="modal-historial" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
            <div class="modal-content border-0 shadow-lg rounded-4">
                <div class="modal-header bg-dark text-white rounded-top-4">
                    <h5 class="modal-title fw-bold">📖 Historial del Vehículo</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <div class="table-responsive">
                        <table class="table table-hover align-middle">
                            <thead class="table-light">
                                <tr>
                                    <th scope="col">Fecha</th>
                                    <th scope="col">Actividad</th>
                                    <th scope="col">Detalles</th>
                                </tr>
                            </thead>
                            <tbody id="tabla-historial">
                                </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    
    <script src="js/principal.js?v=909090"></script>

    <script>
        function cerrarSesion() {
            localStorage.removeItem('usuarioFlota');
            window.location.href = 'login.html';
        }
    </script>
</body>
</html>
