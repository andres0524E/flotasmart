<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión | FlotaSmart</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
</head>
<body class="bg-light d-flex align-items-center justify-content-center" style="height: 100vh;">
    
    <div class="card shadow-lg border-0 p-4" style="width: 100%; max-width: 400px; border-radius: 20px;">
        <div class="text-center mb-4">
            <h2 class="fw-bold text-primary">✨ FlotaSmart</h2>
            <p class="text-muted">Acceso seguro al sistema</p>
        </div>

        <form id="formulario-login">
            <div class="mb-3">
                <label class="form-label text-muted fw-bold">Correo Electrónico</label>
                <input type="email" class="form-control p-2" id="login-correo" placeholder="ejemplo@empresa.com" required>
            </div>
            <div class="mb-4">
                <label class="form-label text-muted fw-bold">Contraseña</label>
                <input type="password" class="form-control p-2" id="login-contrasena" placeholder="••••••••" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold p-2">Iniciar Sesión</button>
        </form>

        <div id="mensaje-error" class="alert alert-danger mt-3 d-none text-center border-0 shadow-sm" style="border-radius: 10px;"></div>
    </div>

    <script src="js/login.js"></script>
</body>
</html>
