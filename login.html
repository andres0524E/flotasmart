<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlotaSmart | Acceso Seguro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/estilos.css">
    <style>
        body { 
            background-color: #f8f9fa; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
        }
        .login-card { 
            max-width: 400px; 
            width: 100%; 
            padding: 2.5rem 2rem; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.05); 
            background: white; 
        }
    </style>
</head>
<body>

    <div class="login-card text-center">
        <h2 class="fw-bold text-primary mb-1">✨ FlotaSmart</h2>
        <p class="text-muted mb-4 small">Acceso seguro al sistema</p>
        
        <form id="formulario-login">
            <div class="mb-3 text-start">
                <label class="form-label text-muted fw-bold small">Correo Electrónico</label>
                <input type="email" class="form-control bg-light" id="correo" placeholder="ejemplo@flotasmart.com" required>
            </div>
            <div class="mb-4 text-start">
                <label class="form-label text-muted fw-bold small">Contraseña</label>
                <input type="password" class="form-control bg-light" id="password" placeholder="••••••••" required>
            </div>
            
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2 shadow-sm">Iniciar Sesión</button>
        </form>

        <div id="mensaje-error" class="alert alert-danger mt-3 d-none small fw-bold" role="alert"></div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script src="js/login.js?version=999"></script>

</body>
</html>
