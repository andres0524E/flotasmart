<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FlotaSmart | Acceso</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" href="img/favicon.png">
    <style>
        *,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
        :root{--bg:#080c14;--card:#0e1421;--border:rgba(255,255,255,0.06);--accent:#ff4d4d;--accent2:#cc0000;--text:#e8edf5;--muted:#5a6a80;--danger:#ff4757;--success:#00e676}
        body{background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden}
        body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(255,77,77,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,77,77,0.03) 1px,transparent 1px);background-size:50px 50px;animation:gridMove 20s linear infinite;pointer-events:none}
        @keyframes gridMove{0%{background-position:0 0}100%{background-position:50px 50px}}
        .orb{position:fixed;border-radius:50%;filter:blur(80px);opacity:.15;pointer-events:none;animation:orbFloat 8s ease-in-out infinite alternate}
        .orb-1{width:400px;height:400px;background:#cc0000;top:-100px;left:-100px}
        .orb-2{width:300px;height:300px;background:#ff4d4d;bottom:-80px;right:-80px;animation-delay:-4s}
        @keyframes orbFloat{0%{transform:translate(0,0) scale(1)}100%{transform:translate(30px,20px) scale(1.1)}}
        .login-wrap{width:100%;max-width:420px;padding:16px;position:relative;z-index:10;animation:slideUp .6s cubic-bezier(.16,1,.3,1) both}
        @keyframes slideUp{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:translateY(0)}}
        .login-card{background:var(--card);border:1px solid var(--border);border-radius:24px;padding:48px 40px;box-shadow:0 0 0 1px rgba(255,77,77,0.05),0 40px 80px rgba(0,0,0,0.5);position:relative;overflow:hidden}
        .login-card::before{content:'';position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(255,77,77,0.4),transparent)}
        .logo{font-family:'Montserrat',sans-serif;font-size:26px;font-weight:800;letter-spacing:-.5px;margin-bottom:6px}
        .logo span{color:var(--accent)}
        .logo-dot{display:inline-block;width:8px;height:8px;background:var(--accent);border-radius:50%;margin-left:2px;animation:pulse 2s ease-in-out infinite;vertical-align:middle;margin-bottom:3px}
        @keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(255,77,77,0.4)}50%{box-shadow:0 0 0 8px rgba(255,77,77,0)}}
        .tagline{color:var(--muted);font-size:13px;letter-spacing:.5px;margin-bottom:40px}
        .field-group{margin-bottom:20px}
        .field-label{display:block;font-size:11px;font-weight:600;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
        .field-input{width:100%;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:12px;color:var(--text);font-family:'Inter',sans-serif;font-size:15px;padding:14px 18px;transition:all .2s;outline:none}
        .field-input::placeholder{color:var(--muted)}
        .field-input:focus{border-color:rgba(255,77,77,0.4);background:rgba(255,77,77,0.04);box-shadow:0 0 0 3px rgba(255,77,77,0.08)}
        .btn-login{width:100%;background:linear-gradient(135deg,var(--accent2),var(--accent));border:none;border-radius:12px;color:#fff;font-family:'Montserrat',sans-serif;font-size:14px;font-weight:700;letter-spacing:.5px;padding:16px;cursor:pointer;margin-top:8px;position:relative;overflow:hidden;transition:all .3s}
        .btn-login:hover{transform:translateY(-2px);box-shadow:0 8px 25px rgba(204,0,0,0.4)}
        .btn-login:active{transform:translateY(0)}
        .alert-error{background:rgba(255,71,87,0.1);border:1px solid rgba(255,71,87,0.3);border-radius:10px;color:#ff6b7a;font-size:13px;padding:12px 16px;margin-top:16px;display:none;animation:shake .4s ease}
        @keyframes shake{0%,100%{transform:translateX(0)}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
    </style>
</head>
<body>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="login-wrap">
        <div class="login-card">
            <div class="logo"><i class="fa-solid fa-truck-fast"></i> Flota<span>Smart</span><span class="logo-dot"></span></div>
            <p class="tagline">Sistema de gestión inteligente de flotas</p>
            <form id="formulario-login">
                <div class="field-group">
                    <label class="field-label" for="correo">Correo Electrónico</label>
                    <input type="email" class="field-input" id="correo" placeholder="operador@empresa.mx" required autocomplete="email">
                </div>
                <div class="field-group">
                    <label class="field-label" for="password">Contraseña</label>
                    <input type="password" class="field-input" id="password" placeholder="••••••••" required autocomplete="current-password">
                </div>
                <button type="submit" class="btn-login" id="btn-ingresar">Ingresar al Sistema</button>
            </form>
            <div id="mensaje-error" class="alert-error"></div>
        </div>
    </div>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const formulario = document.getElementById('formulario-login');
            const btnIngresar = document.getElementById('btn-ingresar');
            formulario.addEventListener('submit', async (e) => {
                e.preventDefault();
                const correo = document.getElementById('correo').value.trim();
                const password = document.getElementById('password').value;
                const divError = document.getElementById('mensaje-error');
                divError.style.display = 'none';
                if (!correo.includes('@') || correo.length > 100 || password.length < 4) {
                    divError.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Credenciales inválidas.';
                    divError.style.display = 'block'; return;
                }
                btnIngresar.innerHTML = '<i class="fa-solid fa-circle-notch fa-spin"></i> Verificando...';
                btnIngresar.disabled = true;
                try {
                    const res = await fetch('https://flotasmart-backend.onrender.com/api/login', {
                        method: 'POST', headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ correo, contrasena: password })
                    });
                    const data = await res.json();
                    if (res.ok && data.usuario) {
                        const sesionSegura = {
                            id_usuario: data.usuario.id_usuario, nombre: data.usuario.nombre,
                            correo: data.usuario.correo, rol: data.usuario.rol, _ts: Date.now()
                        };
                        localStorage.setItem('usuarioFlota', JSON.stringify(sesionSegura));
                        btnIngresar.innerHTML = '<i class="fa-solid fa-check"></i> Acceso concedido';
                        btnIngresar.style.background = 'linear-gradient(135deg,#00b09b,#00e676)';
                        setTimeout(() => window.location.href = 'index.html', 600);
                    } else {
                        divError.innerHTML = '<i class="fa-solid fa-xmark"></i> ' + (data.error || 'Credenciales incorrectas');
                        divError.style.display = 'block';
                        btnIngresar.textContent = 'Ingresar al Sistema';
                        btnIngresar.disabled = false;
                    }
                } catch (err) {
                    divError.innerHTML = '<i class="fa-solid fa-wifi"></i> Sin conexión al servidor.';
                    divError.style.display = 'block';
                    btnIngresar.textContent = 'Ingresar al Sistema';
                    btnIngresar.disabled = false;
                }
            });
        });
    </script>
</body>
</html>
